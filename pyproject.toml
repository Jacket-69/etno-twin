[project]
name = "etno-twin"
version = "0.0.0"
description = "Population-level inference on extreme trans-Neptunian objects under joint orbital and selection uncertainty"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín López Huidobro" }]
keywords = ["astronomy", "trans-neptunian", "simulation-based-inference", "survey-bias"]
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
dependencies = []

[project.scripts]
etno-twin = "etno_twin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
spike = [
    "sbi>=0.27.0",
    "snakemake>=9.25.2",
    "sorcha>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etno_twin"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs real survey simulators or external archives; excluded from CI",
]
